name: Build and Deploy Distill Website

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 8 1 * *' # Auto-rebuilds on the 1st of every month to pull latest updates
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up Chrome (for pagedown PDF rendering)
        uses: browser-actions/setup-chrome@latest

      - name: Install R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rmarkdown
            any::distill
            any::pagedown
            any::dplyr
            any::glue
            any::magrittr
            any::readr
            any::readxl
            any::xml2
            any::leaflet
            any::leafpop
            any::maps
            any::googledrive
            any::googlesheets4
            any::readtext
            any::fontawesome
            any::fs

      - name: Run site build script
        run: Rscript run.R

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          commit_message: "Automated site rebuild from GitHub Actions"
